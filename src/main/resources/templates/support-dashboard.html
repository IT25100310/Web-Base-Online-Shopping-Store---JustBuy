<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Support Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #fff5eb;" class="container-fluid p-4">

<div class="card shadow-sm" style="border: 1px solid #ffe0cc;">
    <div class="card-header text-white" style="background-color: #ff944d;">
        <h3 class="mb-0">Customer Support Dashboard</h3>
    </div>
    <div class="card-body bg-white p-0">
        <table class="table table-hover align-middle mb-0">
            <thead style="background-color: #ffe6d5;">
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Subject</th>
                <th>Description</th>
                <th>Status</th>
                <th>Agent Response</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.category}"></td>
                <td th:text="${t.subject}"></td>
                <td th:text="${t.description}"></td>
                <td>
                        <span class="badge text-white"
                              th:style="${t.status == 'Open' ? 'background-color: #ffaa80;' : (t.status == 'In Progress' ? 'background-color: #ff8000;' : 'background-color: #28a745;')}"
                              th:text="${t.status}"></span>
                </td>
                <td th:text="${t.agentResponse ?: 'No response yet'}"></td>
                <td>
                    <form th:action="@{/support/in-progress/{id}(id=${t.id})}" method="post" class="d-inline" th:if="${t.status == 'Open'}">
                        <button type="submit" class="btn btn-sm text-white" style="background-color: #ff8000;">In Progress</button>
                    </form>

                    <form th:action="@{/support/resolve/{id}(id=${t.id})}" method="post" class="d-inline" th:if="${t.status != 'Resolved'}">
                        <input type="text" name="response" placeholder="Resolution..." required class="form-control form-control-sm d-inline-block w-auto">
                        <button type="submit" class="btn btn-sm btn-success">Resolve</button>
                    </form>

                    <form th:action="@{/support/delete/{id}(id=${t.id})}" method="post" class="d-inline" th:if="${t.status == 'Resolved'}">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete ticket?')">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
