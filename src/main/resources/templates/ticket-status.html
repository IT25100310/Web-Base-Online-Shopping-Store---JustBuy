<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #fff5eb;" class="container py-5">

<div class="mx-auto" style="max-width: 700px;">
    <div class="alert text-center fw-bold border-0 shadow-sm mb-4" style="background-color: #ffe6d5; color: #cc5200;">
        Ticket Raised Successfully!
    </div>

    <!-- Details Card -->
    <div class="card shadow-sm mb-4" style="border: 1px solid #ffe0cc;">
        <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #ff944d;">
            <h5 class="mb-0">Ticket Details (ID: <span th:text="${ticket.id}"></span>)</h5>
            <div>
                <span class="badge bg-white text-dark me-2" th:text="${ticket.status}"></span>

                <form th:action="@{/support/customer-delete/{id}(id=${ticket.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-light" onclick="return confirm('Delete this ticket?')">Delete</button>
                </form>
            </div>
        </div>
        <div class="card-body bg-white">
            <p><strong>Category:</strong> <span th:text="${ticket.category}"></span></p>
            <p><strong>Subject:</strong> <span th:text="${ticket.subject}"></span></p>
            <p><strong>Description:</strong> <span th:text="${ticket.description}"></span></p>
            <p class="mb-0"><strong>Agent Response:</strong> <span th:text="${ticket.agentResponse ?: 'No response yet'}"></span></p>
        </div>
    </div>

    <!-- Edit Form -->
    <div class="card shadow-sm" th:if="${ticket.status == 'Open'}" style="border: 1px solid #ffe0cc;">
        <div class="card-header bg-white fw-bold" style="color: #ff944d; border-bottom: 2px solid #ff944d;">
            Edit Ticket
        </div>
        <div class="card-body bg-white">
            <form th:action="@{/support/update/{id}(id=${ticket.id})}" th:object="${ticket}" method="post">
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="category" th:value="${ticket.category}" required>
                        <option value="Order Issue">Order Issue</option>
                        <option value="Product">Product</option>
                        <option value="Delivery">Delivery</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" name="subject" th:value="${ticket.subject}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3" th:text="${ticket.description}" required></textarea>
                </div>
                <button type="submit" class="btn text-white fw-bold" style="background-color: #ff944d;">Save Changes</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
