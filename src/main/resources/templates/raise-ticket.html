<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Raise a Support Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #fff5eb;" class="container py-5">

<div class="card shadow-sm mx-auto" style="max-width: 600px; border: 1px solid #ffe0cc;">
    <div class="card-header text-white text-center py-3" style="background-color: #ff944d;">
        <h3 class="mb-0">Raise a Support Ticket</h3>
    </div>
    <div class="card-body p-4 bg-white">
        <form th:action="@{/support/raise}" th:object="${ticket}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Category</label>
                <select class="form-select" name="category" required>
                    <option value="Order Issue">Order Issue</option>
                    <option value="Product">Product</option>
                    <option value="Delivery">Delivery</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Subject</label>
                <input type="text" class="form-control" name="subject" placeholder="Enter topic..." required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea class="form-control" name="description" rows="4" placeholder="Explain your issue..." required></textarea>
            </div>

            <button type="submit" class="btn text-white w-100 fw-bold" style="background-color: #ff944d;">Submit Ticket</button>
        </form>
    </div>
</div>

</body>
</html>
