<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory Audit - E-Shop Inventory</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="container">
<div th:replace="~{fragments/layout :: messages}"></div>
<div class="page-header"><div><p class="eyebrow">Admin</p><h1>Inventory Audit Log</h1><p class="muted">Every quantity change is recorded for traceability.</p></div></div>
<div class="card table-card"><table><thead><tr><th>Date</th><th>SKU</th><th>Product</th><th>Operation</th><th>Change</th><th>Before</th><th>After</th><th>Reference</th><th>Performed By</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td th:text="${#temporals.format(t.createdAt,'dd MMM HH:mm')}"></td><td th:text="${t.item.sku}"></td><td th:text="${t.item.productName}"></td><td th:text="${t.type.label}"></td><td th:text="${t.quantityChanged > 0 ? '+' + t.quantityChanged : t.quantityChanged}"></td><td th:text="${t.previousQuantity}"></td><td th:text="${t.newQuantity}"></td><td th:text="${t.referenceId ?: '-'}"></td><td th:text="${t.performedBy}"></td></tr></tbody></table></div>
</main>
</body>
</html>
