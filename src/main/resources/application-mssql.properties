# Use this profile when connecting the module to the group's Microsoft SQL Server database.
# IntelliJ VM option example: -Dspring.profiles.active=mssql
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=eshopping;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false
