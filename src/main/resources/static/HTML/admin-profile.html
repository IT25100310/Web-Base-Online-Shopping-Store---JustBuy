<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Profile - JustBuy</title><link rel="stylesheet" href="../css/admin-dashboard.css"><style>.profile-page{max-width:980px;margin:auto}.profile-card{max-width:620px;margin:28px auto;padding:30px}.profile-avatar{display:grid;place-items:center;width:88px;height:88px;margin-bottom:20px;border-radius:26px;background:linear-gradient(135deg,var(--orange),var(--terra));color:#fff;font:700 30px 'Space Grotesk',sans-serif}.profile-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.profile-details .detail{background:var(--surface)}.profile-actions{display:flex;gap:10px;justify-content:flex-end}@media(max-width:620px){.profile-details{grid-template-columns:1fr}}</style></head><body><main class="admin-shell profile-page"><header class="admin-header"><a class="brand" href="/HTML/index.html#/">⚡ Just<span>Buy</span></a><div class="admin-header-actions"><button id="logout" class="button secondary">Log out</button></div></header><section class="profile-card application"><div class="profile-avatar" id="profile-avatar">JA</div><label class="button secondary" for="profile-picture-input">Change profile picture</label><input id="profile-picture-input" type="file" accept="image/*" hidden><p class="eyebrow">ADMINISTRATOR PROFILE</p><h1 id="profile-name">Administrator</h1><p class="application-sub">Administrator account details and live platform overview.</p><div class="profile-details" id="profile-details"></div><div class="profile-actions"><a class="button secondary" href="/HTML/admin-dashboard.html">Back to dashboard</a></div></section></main><script type="module" src="/js/admin-profile.js"></script></body></html>
